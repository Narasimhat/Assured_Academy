name: Verify Academy and Studio
on:
  pull_request:
  push:
    branches: [main, feature/assured-studio-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:vendor
      - run: npm run test:reference
      - run: npm run test:studio
      - run: npm run test:engines
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
